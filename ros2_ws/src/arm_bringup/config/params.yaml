    urdf_path: "/work/models/so101/so101_dynamics.urdf"
    controller_type: "pd"
    reference_type: "smooth"
    rate_hz: 200.0
    # Naive PD gains and target -- identical to the Phase 1.5 oracle.
    kp: [40.0, 40.0, 25.0, 15.0, 8.0, 5.0]
    kd: [3.0, 3.0, 2.0, 1.0, 0.6, 0.4]
